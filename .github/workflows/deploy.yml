name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Required for peaceiris/actions-gh-pages to push to gh-pages branch
permissions:
  contents: write

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive  # Fetch tabi theme

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Build from source to enable Japanese search (indexing-ja).
      # Pre-built Zola binaries don't include this feature.
      # Binary is cached automatically (~7 day TTL); first build ~5 min.
      - name: Install Zola
        uses: baptiste0928/cargo-install@v3.4.0
        with:
          crate: zola
          version: "0.22.1"
          features: indexing-ja
          locked: true

      - name: Build
        run: zola build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
